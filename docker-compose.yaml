version: '3.8'

services:
  db:
    image: postgres:16
    container_name: auth-service-db
    environment:
      POSTGRES_DB: auth_services
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5445:5432"
    volumes:
      - auth_services_data:/var/lib/postgresql/data

volumes:
  auth_services_data:
